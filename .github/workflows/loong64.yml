

name: Build loong64 kernel for Debian

permissions: write-all

on:
  push:
    branches: [ "main", "stable-7.1.5" ]
  pull_request:
    branches: [ "main", "stable-7.1.5" ]
  workflow_dispatch:
jobs:
  debian:
    strategy:
      matrix:
        mmu-size: ['config-16k', 'config-4k']
    runs-on: ubuntu-latest
    name: Build loong64 kernel ${{ matrix.mmu-size }}
    permissions: write-all
    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 4096
          swap-size-mb: 512
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Checkout linux sources
        uses: actions/checkout@v4
        with:
          repository: AOSC-Tracking/linux
          ref: 0ae54d7452d6286b4e03d0b6d36f047e70f30b83
          fetch-depth: 1
          submodules: recursive 
          path: 'linux'

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up loong64 Debian container
        uses: addnab/docker-run-action@v3
        with:
          image: docker.io/library/debian:trixie
          options: --privileged -v ${{ github.workspace }}:/work
          shell: bash
          run: |
            set -euxo pipefail
            cd /work
            export DEBIAN_FRONTEND=noninteractive

            apt update
            apt install -y --no-install-recommends \
              build-essential bc kmod cpio flex bison debhelper rsync \
              sudo systemd zstd libdw-dev gawk devscripts equivs git xz-utils fakeroot wget curl \
              libncurses-dev libelf-dev libssl-dev dwarves \
              gcc-loongarch64-linux-gnu g++-loongarch64-linux-gnu

            git config --global --add safe.directory /work/linux

            pushd linux

            cp -v ../${{ matrix.mmu-size }} .config
            export KCONFIG_CONFIG=$(realpath ./.config)            
            make ARCH=loongarch CROSS_COMPILE=loongarch64-linux-gnu- olddefconfig

            export lv=$(make -s ARCH=loongarch CROSS_COMPILE=loongarch64-linux-gnu- kernelversion)
            export xv=""
            export rv=0
            export git=$(git rev-parse --short=7 HEAD)
            export dv=$(git show -s --date=format:'%Y%m%d' --format=%cd)
            pvcmd="cat .config | grep 'LOCALVERSION='" && export pv=$(eval $pvcmd | cut -d'"' -f2 || true)

            git config --global user.name "Github Actions"
            git config --global user.email "actions@noreply.github.com"

            make ARCH=loongarch CROSS_COMPILE=loongarch64-linux-gnu- \
              KDEB_PKGVERSION="$lv$pv$xv-$rv~$dv.g$git" \
              DPKG_FLAGS="-d" \
              bindeb-pkg -j$(nproc)
            popd

            mkdir -p assets/ && mv ./*.deb assets/

      - name: Artifact
        uses: actions/upload-artifact@v4
        with:
          name: loong64 kernel for Debian ${{ matrix.mmu-size }}
          path: assets/*
          compression-level: 0
          if-no-files-found: error # 'warn' or 'ignore' are also available, defaults to `warn`
